name: Deploy to GCP VM (Camera Catcher)

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'neolink.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-vm.yml'

jobs:
  deploy:
    name: Sync Code to Compute Engine e2-micro
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy Code to VM via Rsync
        run: |
          echo "Sincronizando archivos hacia /opt/camera-catcher..."
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.package-lock.hash' \
            --exclude '.env' \
            --exclude 'daemon.log' \
            src scripts package.json package-lock.json neolink.toml \
            ${{ secrets.VM_USER || 'deploy' }}@${{ secrets.VM_HOST }}:/opt/camera-catcher/

      - name: Install Dependencies & Restart Service
        run: |
          echo "Verificando dependencias e iniciando el servicio systemd..."
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.VM_USER || 'deploy' }}@${{ secrets.VM_HOST }} "
            cd /opt/camera-catcher && \
            CURRENT_HASH=\$(sha256sum package-lock.json 2>/dev/null | cut -d ' ' -f 1) && \
            PREV_HASH=\$(cat .package-lock.hash 2>/dev/null || echo '') && \
            if [ \"\$CURRENT_HASH\" != \"\$PREV_HASH\" ] || [ ! -d 'node_modules' ] || [ ! -d 'node_modules/onnxruntime-node' ] || [ ! -d 'node_modules/sharp' ]; then
              echo '⚠️ Cambio en dependencias detectado. Instalando paquetes faltantes...' && \
              npm install --omit=dev && \
              echo \"\$CURRENT_HASH\" > .package-lock.hash;
            else
              echo '⚡ Dependencias sin cambios. Saltando npm install para optimizar tiempo.';
            fi && \
            echo '🧹 Limpiando contenedores Neolink colgados...' && \
            docker ps -a -q --filter name=neolink-capture | xargs -r docker rm -f 2>/dev/null || true && \
            docker rm -f neolink-capture 2>/dev/null || true && \
            sudo systemctl restart camera-catcher.service && \
            sudo systemctl is-active camera-catcher.service
          "
          echo "✅ Despliegue en la VM completado exitosamente y servicio activo!"
