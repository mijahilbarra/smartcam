name: Diagnostics & VM Logs

on:
  workflow_dispatch:
    inputs:
      lines:
        description: 'Number of log lines to fetch'
        required: false
        default: '100'
      trigger_capture:
        description: 'Trigger a manual capture via port 8085 (/capture)?'
        required: false
        default: 'false'

jobs:
  inspect:
    name: Fetch Logs & Status from GCP VM
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run Diagnostics on VM
        run: |
          SSH_CMD="ssh -o StrictHostKeyChecking=accept-new ${{ secrets.VM_USER || 'deploy' }}@${{ secrets.VM_HOST }}"

          echo "=================================================="
          echo "=== 0. LIMPIEZA DE CONTENEDORES ZOMBIES ==="
          echo "=================================================="
          $SSH_CMD "
            echo 'Eliminando contenedores de captura huérfanos...'
            docker ps -a -q --filter name=neolink-capture | xargs -r docker rm -f 2>/dev/null || true
            docker rm -f neolink-capture 2>/dev/null || true
          "

          echo "=================================================="
          echo "=== 1. ESTADO DEL SERVICIO SYSTEMD ==="
          echo "=================================================="
          $SSH_CMD "systemctl status camera-catcher.service --no-pager || true"

          echo "=================================================="
          echo "=== 2. PROCESOS NODE, DOCKER Y CONTENEDORES ==="
          echo "=================================================="
          $SSH_CMD "
            ps aux | grep -E 'node|neolink|docker' | grep -v grep || true
            echo '--- Docker Containers ---'
            docker ps -a 2>/dev/null || echo 'Sin permisos directos de docker CLI'
          "

          echo "=================================================="
          echo "=== 3. PRUEBA HEALTH CHECK LOCAL (Port 8085) ==="
          echo "=================================================="
          $SSH_CMD "curl -sv http://127.0.0.1:8085/ || echo 'Fallo conectando al puerto 8085'"

          echo "=================================================="
          echo "=== 4. TEST DE CARGA DE MODULOS EN SECO ==="
          echo "=================================================="
          $SSH_CMD "
            cd /opt/camera-catcher && node -e '
              import(\"./src/detector.js\").then(d => {
                console.log(\"Detector import OK\");
              }).catch(err => {
                console.error(\"Detector import FAILED:\", err);
              });
            '
          "

          echo "=================================================="
          echo "=== 5. ARCHIVOS DE LOG LOCALES (/opt/camera-catcher/daemon.log) ==="
          echo "=================================================="
          $SSH_CMD "
            tail -n ${{ inputs.lines || 100 }} /opt/camera-catcher/daemon.log 2>/dev/null || \
            tail -n ${{ inputs.lines || 100 }} /tmp/camera-catcher.log 2>/dev/null || \
            echo 'No se encontraron archivos de log en disco'
          "

          echo "=================================================="
          echo "=== 6. JOURNALCTL DE SYSTEMD ==="
          echo "=================================================="
          $SSH_CMD "
            journalctl -u camera-catcher.service -n ${{ inputs.lines || 100 }} --no-pager 2>/dev/null || \
            sudo -n journalctl -u camera-catcher.service -n ${{ inputs.lines || 100 }} --no-pager 2>/dev/null || \
            echo 'Sin permisos para journalctl'
          "

          echo "=================================================="
          echo "=== 7. TRIGGER MANUAL DE CAPTURA (/capture) ==="
          echo "=================================================="
          if [ "${{ inputs.trigger_capture }}" = "true" ]; then
            $SSH_CMD "curl -s -m 60 http://127.0.0.1:8085/capture || echo 'Error o timeout en /capture'"
          else
            echo "Saltando trigger manual (/capture). Para ejecutarlo, active trigger_capture=true."
          fi
