services:
  fast-simulator:
    build:
      context: .
      dockerfile: Dockerfile.e2-sim
    container_name: ${SIM_CONTAINER_NAME:-fast-sim}
    init: true
    command: ["node", "--max-old-space-size=2048", "--watch", "--watch-path=src", "src/index.js"]
    restart: unless-stopped
    # Sin límites restrictivos de CPU/RAM (utiliza todos los cores disponibles del host)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /tmp:/tmp
      - ./neolink.toml:/opt/camera-catcher/neolink.toml
      - ./src:/opt/camera-catcher/src
      - ./scripts:/opt/camera-catcher/scripts
      - ${SIM_DATA_DIR:-./data}:/opt/camera-catcher/data
      - ${HOME:-~}/.config/gcloud:/root/.config/gcloud:ro
    ports:
      - "${SIM_PORT:-8085}:8085"
    environment:
      - NODE_ENV=development
      - IS_LOCAL_SIMULATOR=true
      - USE_FIREBASE=${USE_FIREBASE:-true}
      - MOCK_VIDEO_PATH=${MOCK_VIDEO_PATH:-data/recordings/mock_stream.mp4}
      - MOCK_VIDEO_LAST_MINUTES=${MOCK_VIDEO_LAST_MINUTES:-}
      - MOCK_VIDEO_START_SS=${MOCK_VIDEO_START_SS:-}
      - MOCK_VIDEO_DURATION_SS=${MOCK_VIDEO_DURATION_SS:-}
      - MOCK_VIDEO_LOOP=${MOCK_VIDEO_LOOP:-false}
      - STREAM_FPS=${STREAM_FPS:-1}
      - STREAM_FAST_FORWARD=${STREAM_FAST_FORWARD:-true}
      - REALTIME_INTERVAL_MS=${REALTIME_INTERVAL_MS:-10}
      - FIRESTORE_DATABASE_ID=test
      - FIREBASE_PROJECT_ID=skip-bigotes
      - STORAGE_BUCKET=skip-bigotes-test
      - PORT=8085
      - RTSP_STREAM_URL=rtsp://host.docker.internal:8554/barberia/sub
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - NEOLINK_TOML_PATH=/opt/camera-catcher/neolink.toml
      - STAFF_EXCLUSION_THRESHOLD=${STAFF_EXCLUSION_THRESHOLD:-0.46}
      - ML_MODEL_PATH=/opt/camera-catcher/src/models/yolov8n.onnx
