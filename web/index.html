<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IOT Camera Catcher - Skip Bigotes</title>
  
  <!-- Google Fonts Preconnect & Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <!-- Font Loading Visibility Gate: Prevents FOUT / Font Flash -->
  <script>
    (function() {
      document.documentElement.classList.add("fonts-loading");
      var fontTimeout = setTimeout(function() {
        document.documentElement.classList.remove("fonts-loading");
        document.documentElement.classList.add("fonts-loaded");
      }, 1000);
      if ("fonts" in document) {
        document.fonts.ready.then(function() {
          clearTimeout(fontTimeout);
          document.documentElement.classList.remove("fonts-loading");
          document.documentElement.classList.add("fonts-loaded");
        }).catch(function() {
          clearTimeout(fontTimeout);
          document.documentElement.classList.remove("fonts-loading");
          document.documentElement.classList.add("fonts-loaded");
        });
      }
    })();
  </script>
</head>
<body class="bg-slate-900 text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
