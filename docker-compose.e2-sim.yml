services:
  e2-simulator:
    build:
      context: .
      dockerfile: Dockerfile.e2-sim
    container_name: e2-micro-sim
    init: true
    command: ["node", "--optimize-for-size", "--max-old-space-size=192", "--watch", "--watch-path=src", "src/index.js"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'            # Simula de manera fidedigna la CPU de Compute Engine e2-micro (0.25 vCPU sostenida con throttling)
          memory: 1024M          # Límite estricto de 1 GB RAM (dispara OOM Killer si se supera)
        reservations:
          memory: 512M
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # /tmp para el intercambio de archivos fotográficos con el contenedor Neolink
    volumes:
      - /tmp:/tmp
      - ./neolink.toml:/opt/camera-catcher/neolink.toml
      - ./src:/opt/camera-catcher/src
      - ./scripts:/opt/camera-catcher/scripts
      - ./data:/opt/camera-catcher/data
      - ${HOME:-~}/.config/gcloud:/root/.config/gcloud:ro
    ports:
      - "8085:8085"
    environment:
      - MALLOC_ARENA_MAX=2
      - NODE_ENV=production
      - IS_LOCAL_SIMULATOR=true
      - MOCK_VIDEO_PATH=${MOCK_VIDEO_PATH:-}
      - MOCK_VIDEO_LAST_MINUTES=${MOCK_VIDEO_LAST_MINUTES:-}
      - MOCK_VIDEO_START_SS=${MOCK_VIDEO_START_SS:-}
      - MOCK_VIDEO_DURATION_SS=${MOCK_VIDEO_DURATION_SS:-}
      - MOCK_VIDEO_LOOP=${MOCK_VIDEO_LOOP:-false}
      - FIRESTORE_DATABASE_ID=test
      - FIREBASE_PROJECT_ID=skip-bigotes
      - STORAGE_BUCKET=skip-bigotes-test
      - PORT=8085
      - RTSP_STREAM_URL=rtsp://host.docker.internal:8554/barberia/sub
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - NEOLINK_TOML_PATH=/opt/camera-catcher/neolink.toml
      - REALTIME_INTERVAL_MS=400
      - STAFF_EXCLUSION_THRESHOLD=${STAFF_EXCLUSION_THRESHOLD:-0.25}
      - ML_MODEL_PATH=/opt/camera-catcher/src/models/yolov8n.onnx
